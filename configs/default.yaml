manufacturing:
  num_layers_per_part: 100
  layer_height_mm: 0.2

  # Temperature setpoints
  nozzle_temp_setpoint: 260.0
  bed_temp_setpoint: 70.0
  ambient_temp_initial: 25.0

  # Dynamics
  nozzle_drift_rate: 0.02
  bed_decay_rate: 0.015

  # Noise standard deviations
  nozzle_noise_std: 1.5
  bed_noise_std: 0.8
  ambient_noise_std: 0.3
  vibration_noise_std: 0.1
  extrusion_noise_std: 0.05

  # Ambient bounds
  ambient_temp_min: 20.0
  ambient_temp_max: 35.0

  # Vibration model
  vibration_base: 0.5
  vibration_height_coeff: 0.03

  # Cooling model
  cooling_gamma: 0.1
  cooling_height_damping: 0.05

  # Adhesion sigmoid weights
  adhesion_w_nozzle: 0.02
  adhesion_w_bed: 0.03
  adhesion_w_cooling: 0.01
  adhesion_w_extrusion: 2.0
  adhesion_w_vibration: 1.5
  adhesion_bias: -5.0

  # Stress accumulation weights
  stress_w_thermal: 0.3
  stress_w_adhesion: 0.3
  stress_w_vibration: 0.2
  stress_w_height: 0.2

  # Risk sigmoid weights
  risk_w_thermal: 2.0
  risk_w_adhesion: 2.5
  risk_w_vibration: 1.5
  risk_w_height: 1.0
  risk_w_stress: 1.5
  risk_bias: -5.0

  # Normalization constants
  nozzle_norm_std: 3.0
  vibration_normalizer: 1.2
  thermal_rolling_window: 5

  # Defect threshold
  risk_threshold: 0.5

detection:
  true_positive_rate: 0.90
  false_positive_rate: 0.05
  calibration_bias: 0.0
  confidence_noise: 0.05

population:
  num_operators: 20
  operator_defaults:
    trust_initial: [0.5, 0.15]
    fatigue_rate: 0.01
    skill_level: [0.7, 0.2]
    automation_bias_strength: 0.3
    vigilance_decrement_rate: 0.005
  shift_duration_hours: 8.0
  assignment_policy: round_robin

clock:
  num_steps: 1000
  parts_per_step: 5

master_seed: 42
