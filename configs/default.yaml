manufacturing:
  num_layers_per_part: 100
  defect_base_rate: 0.02
  defect_type_weights:
    porosity: 0.4
    cracking: 0.25
    delamination: 0.2
    geometric: 0.15
  spatial_correlation: 0.3
  severity_distribution: beta

detection:
  base_sensitivity: 0.85
  base_specificity: 0.90
  confidence_noise_std: 0.1
  sensitivity_by_type:
    porosity: 0.90
    cracking: 0.85
    delamination: 0.80
    geometric: 0.75
  severity_sensitivity_curve: sigmoid

population:
  num_operators: 20
  operator_defaults:
    trust_initial: [0.5, 0.15]
    fatigue_rate: 0.01
    skill_level: [0.7, 0.2]
    automation_bias_strength: 0.3
    vigilance_decrement_rate: 0.005
  shift_duration_hours: 8.0
  assignment_policy: round_robin

clock:
  num_steps: 1000
  parts_per_step: 5

master_seed: 42
