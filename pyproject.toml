[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawks"
version = "0.1.0"
description = "Human-AI Workforce Dynamics in Safety-Critical Manufacturing Systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
hawks-run = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
include = ["hawks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
